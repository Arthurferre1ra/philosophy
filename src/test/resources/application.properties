spring.datasource.url=jdbc:h2:mem:philosophy-tests-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test_uuid_schema.sql,classpath:db/migration/V3__persist_profile_fields_and_add_indexes.sql
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
