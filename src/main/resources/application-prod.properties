# Credenciais e endereco do banco sao fornecidos pelo ambiente de producao.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Evita registrar consultas e transacoes detalhadas em producao.
logging.level.org.hibernate.SQL=${DB_SQL_LOG_LEVEL:INFO}
logging.level.org.springframework.orm.jpa.JpaTransactionManager=${DB_TRANSACTION_LOG_LEVEL:INFO}
logging.level.org.springframework.jdbc.core.JdbcTemplate=${DB_SQL_LOG_LEVEL:INFO}
