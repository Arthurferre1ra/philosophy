spring.application.name=philosophy

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/philosophy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.pool-name=PhilosophyPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}

# JPA valida o schema; alterações estruturais continuam sob responsabilidade do Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=${DB_SQL_LOG_LEVEL:DEBUG}
logging.level.org.springframework.orm.jpa.JpaTransactionManager=${DB_TRANSACTION_LOG_LEVEL:DEBUG}

# Os upserts atômicos dos catálogos compartilham a transação JPA.
logging.level.org.springframework.jdbc.core.JdbcTemplate=${DB_SQL_LOG_LEVEL:DEBUG}

spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
