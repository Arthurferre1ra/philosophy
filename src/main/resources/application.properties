spring.application.name=philosophy

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/philosophy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.pool-name=PhilosophyPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}

# Flyway é o único responsável pela criação e evolução do schema.
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Habilitar somente na primeira execução sobre o schema legado documentado no README.
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
